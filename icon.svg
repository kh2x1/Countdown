<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e0f2fe"/>
    </linearGradient>
  </defs>

  <!-- الخلفية -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- الساعة الرملية -->
  <g transform="translate(256 256)">
    <!-- الإطار العلوي والسفلي -->
    <rect x="-118" y="-150" width="236" height="34" rx="17" fill="#ffffff"/>
    <rect x="-118" y="116" width="236" height="34" rx="17" fill="#ffffff"/>

    <!-- الزجاج -->
    <path d="M -92 -116
             L 92 -116
             C 92 -40 26 -16 26 0
             C 26 16 92 40 92 116
             L -92 116
             C -92 40 -26 16 -26 0
             C -26 -16 -92 -40 -92 -116 Z"
          fill="url(#glass)" opacity="0.95"/>

    <!-- الرمل العلوي -->
    <path d="M -70 -104 L 70 -104 C 70 -52 18 -28 0 -14 C -18 -28 -70 -52 -70 -104 Z"
          fill="#f59e0b"/>

    <!-- الرمل السفلي -->
    <path d="M 0 26 C 40 56 58 86 60 104 L -60 104 C -58 86 -40 56 0 26 Z"
          fill="#f59e0b"/>

    <!-- خيط الرمل المتساقط -->
    <rect x="-3" y="-8" width="6" height="48" rx="3" fill="#f59e0b"/>
  </g>
</svg>
